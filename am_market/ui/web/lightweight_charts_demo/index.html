<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NIFTY 50 — Lightweight Charts</title>
  <style>
    :root {
      --bg: #0b0e11;
      --panel: #12151c;
      --text: #d1d4dc;
      --muted: #787b86;
      --up: #26a69a;
      --down: #ef5350;
      --line: #1e222d;
      --accent: #2962ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, Segoe UI, sans-serif;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 20px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .sym { font-size: 18px; font-weight: 650; letter-spacing: 0.02em; }
    .px { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .chg { font-size: 13px; font-weight: 600; }
    .chg.up { color: var(--up); }
    .chg.down { color: var(--down); }
    .meta { margin-left: auto; font-size: 11px; color: var(--muted); text-align: right; }
    .ranges {
      display: flex;
      gap: 6px;
      padding: 10px 20px 0;
    }
    .chip {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: default;
    }
    .chip.on { color: #fff; background: #1b2130; border-color: #2a3347; }
    #chart { flex: 1; min-height: 0; }
    .legend {
      position: absolute;
      left: 72px;
      top: 86px;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
      z-index: 2;
    }
    .legend b { color: var(--text); font-weight: 600; }
    footer {
      padding: 8px 20px 10px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
    footer a { color: #9db2ff; }
    .err { padding: 24px; color: var(--down); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="sym">NIFTY 50</div>
      <div>
        <div class="px" id="last">—</div>
        <div class="chg" id="chg">—</div>
      </div>
      <div class="meta">
        Prod POST /market/v1/market-data/historical-data<br />
        1D · 24 Jan 2026 – 29 Jul 2026 · 125 bars
      </div>
    </header>
    <div class="ranges">
      <span class="chip">10m</span>
      <span class="chip">1H</span>
      <span class="chip on">1D</span>
      <span class="chip">1W</span>
      <span class="chip">1M</span>
    </div>
    <div class="legend" id="ohlc"></div>
    <div id="chart"></div>
    <footer>
      Chart engine: <a href="https://tradingview.github.io/lightweight-charts/">TradingView Lightweight Charts</a>
      (not the Advanced Chart widget). Bars are AM market data, not TradingView’s feed.
    </footer>
  </div>
  <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    function toBars(rows) {
      return rows.map((p) => ({
        time: p.time,
        open: p.open,
        high: p.high,
        low: p.low,
        close: p.close,
      }));
    }

    async function main() {
      const L = window.LightweightCharts;
      const data = await fetch('./ohlc.json').then((r) => r.json());
      const nifty = toBars(data['NIFTY 50']);
      const vix = data['INDIA VIX'].map((p) => ({ time: p.time, value: p.close }));

      const first = nifty[0];
      const last = nifty[nifty.length - 1];
      const diff = last.close - first.close;
      const pct = (diff / first.close) * 100;
      document.getElementById('last').textContent = last.close.toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
      const chg = document.getElementById('chg');
      chg.textContent =
        (diff >= 0 ? '+' : '') +
        diff.toFixed(2) +
        '  (' +
        (pct >= 0 ? '+' : '') +
        pct.toFixed(2) +
        '%)  vs first bar';
      chg.className = 'chg ' + (diff >= 0 ? 'up' : 'down');

      const chart = L.createChart(document.getElementById('chart'), {
        autoSize: true,
        layout: {
          background: { type: 'solid', color: '#0b0e11' },
          textColor: '#d1d4dc',
          fontFamily: 'Inter, system-ui, sans-serif',
        },
        grid: {
          vertLines: { color: '#1e222d' },
          horzLines: { color: '#1e222d' },
        },
        crosshair: { mode: L.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2a2e39' },
        timeScale: { borderColor: '#2a2e39', timeVisible: false },
      });

      const candles = chart.addSeries(L.CandlestickSeries, {
        upColor: '#26a69a',
        downColor: '#ef5350',
        borderVisible: false,
        wickUpColor: '#26a69a',
        wickDownColor: '#ef5350',
      });
      candles.setData(nifty);

      const vixLine = chart.addSeries(L.LineSeries, {
        color: '#f0b90b',
        lineWidth: 2,
        priceScaleId: 'left',
        title: 'INDIA VIX',
      });
      vixLine.setData(vix);
      chart.priceScale('left').applyOptions({
        visible: true,
        borderColor: '#2a2e39',
      });

      chart.timeScale().fitContent();

      const ohlcEl = document.getElementById('ohlc');
      chart.subscribeCrosshairMove((param) => {
        const bar = param.seriesData.get(candles);
        if (!bar) {
          ohlcEl.innerHTML = '';
          return;
        }
        ohlcEl.innerHTML =
          '<b>O</b> ' + bar.open.toFixed(2) +
          '  <b>H</b> ' + bar.high.toFixed(2) +
          '  <b>L</b> ' + bar.low.toFixed(2) +
          '  <b>C</b> ' + bar.close.toFixed(2);
      });
    }

    main().catch((e) => {
      document.body.innerHTML = '<p class="err">Failed to load chart: ' + e + '</p>';
    });
  </script>
</body>
</html>
