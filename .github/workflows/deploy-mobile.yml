name: Manual Deploy (Mobile - iOS & Android)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target Platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      environment:
        description: "Target Environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - preprod
          - prod
      upload:
        description: "Upload to TestFlight / Play Store"
        required: true
        default: false
        type: boolean

jobs:
  build-android:
    name: Build Android (${{ github.event.inputs.environment }})
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd am_app
          flutter pub get

      - name: Prepare Keystore (if secret provided)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > am_app/android/app/release-key.jks

      - name: Build Android App Bundle (.aab)
        run: |
          cd am_app
          ENV_NAME="${{ github.event.inputs.environment }}"
          DOMAIN="${{ secrets.AM_DOMAIN || (github.event.inputs.environment == 'prod' && 'am.asrax.in' || (github.event.inputs.environment == 'preprod' && 'am-preprod.asrax.in' || 'am-dev.asrax.in')) }}"
          
          KEYSTORE_PATH="release-key.jks" \
          KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
          KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" \
          flutter build appbundle --release \
            --dart-define=AM_ENV=$ENV_NAME \
            --dart-define=AM_DOMAIN=$DOMAIN \
            --dart-define=AM_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            --dart-define=AM_GOOGLE_IOS_CLIENT_ID="${{ secrets.GOOGLE_IOS_CLIENT_ID }}"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.event.inputs.environment }}
          path: am_app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS (${{ github.event.inputs.environment }})
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install CocoaPods & Dependencies
        run: |
          cd am_app
          flutter pub get
          cd ios
          pod install || true

      - name: Build iOS IPA (.ipa)
        run: |
          cd am_app
          ENV_NAME="${{ github.event.inputs.environment }}"
          DOMAIN="${{ secrets.AM_DOMAIN || (github.event.inputs.environment == 'prod' && 'am.asrax.in' || (github.event.inputs.environment == 'preprod' && 'am-preprod.asrax.in' || 'am-dev.asrax.in')) }}"
          
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=AM_ENV=$ENV_NAME \
            --dart-define=AM_DOMAIN=$DOMAIN \
            --dart-define=AM_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            --dart-define=AM_GOOGLE_IOS_CLIENT_ID="${{ secrets.GOOGLE_IOS_CLIENT_ID }}"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.event.inputs.environment }}
          path: am_app/build/ios/ipa/*.ipa

      - name: Deploy Directly to TestFlight (App Store Connect)
        if: ${{ github.event.inputs.upload == 'true' || github.event.inputs.upload == true }}
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: am_app/build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
