# Unified CI/CD Pipeline — am-modern-ui
#
# Replaces: modern-ui.yml (web caller) + mobile-android.yml (android caller)
#
# Smart path routing:
#   - Android files changed  --> Android build only
#   - Web files changed      --> Web build only
#   - Both changed           --> Both build in parallel
#   - Common/shared Dart     --> Both build (safe default)
#   - docs/README only       --> Nothing builds (fast skip)
#
# Security:
#   - TruffleHog secrets scan runs ONCE (shared gate for both pipelines)
#   - If scan fails, neither web nor android builds run
#
# Phase 8b: Unified caller pointing at am-pipelines@main
#
# Web (trade-like): Build & GitOps — push/PR builds image; on main freezes
#   am-gitops image-tags for Argo. Deploy→Dev/Prod wait for web-* approval;
#   Deploy→Preprod skips on main while GitOps is on (unless force_preprod_helm).
# Manual Helm override: dispatch force_preprod_helm, or deploy-modern-ui.yml.
# Android: Play only via workflow_dispatch + target_env (no GitOps).

name: Unified CI/CD

on:
  push:
    branches: ["main", "develop", "feature/**", "hotfix/**", "fix/**"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "BUILD_INTEGRATION_PLAN.md"
      - "DOCKER_README.md"
      - ".env.example"
      - ".env.preprod.example"
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      force_web:
        description: "Force web build even if no web files changed"
        required: false
        type: boolean
        default: false
      force_android:
        description: "Force android build even if no android files changed"
        required: false
        type: boolean
        default: false
      target_env:
        description: "Environment to Deploy to (Select 'none' just to build/test)"
        required: true
        type: choice
        options:
          - none
          - dev
          - preprod
          - prod
        default: 'none'
      deploy_preprod_helm:
        description: "Helm roll to Kind preprod (image_name-preprod). Feature branches always; on main needs force or gitops off."
        required: false
        type: boolean
        default: true
      gitops_write_preprod:
        description: "On main: auto-commit image tag to am-gitops (Argo). Preferred for main."
        required: false
        type: boolean
        default: true
      force_preprod_helm:
        description: "Helm on main even when gitops is on / Argo Auto-Sync (may fight selfHeal)."
        required: false
        type: boolean
        default: false

jobs:
  # ============================================================
  # TRAFFIC COP - detect which paths changed
  # Outputs: web=true/false, android=true/false
  # ============================================================
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # WEB: Docker image, Helm/K8s charts, nginx config, web assets, and all shared UI modules
            web:
              - 'am_app/Dockerfile'
              - 'am_app/docker-entrypoint.sh'
              - 'am_app/nginx.conf'
              - 'am_app/nginx-docker.conf'
              - 'am_app/nginx.profiles/**'
              - 'am_app/helm/**'
              - 'am_app/web/**'
              - 'am_app/assets/**'
              - 'am_app/pubspec.yaml'
              - 'am_app/pubspec.lock'
              - 'am_app/lib/**'
              - 'am_app/analysis_options.yaml'
              - 'am_library/**'
              - 'am_common/**'
              - 'am_design_system/**'
              - 'am_analysis/**'
              - 'am_market/**'
              - 'am_portfolio_ui/**'
              - 'am_trade_ui/**'
              - 'am_auth_ui/**'
              - 'am_dashboard_ui/**'
              - 'am_ai_ui/**'
              - 'am_subscription_ui/**'
              - 'am_user_ui/**'
              - 'am_diagnostic_ui/**'
              - 'am_doc_intelligence_ui/**'
              - '.github/workflows/unified-ci.yml'

            # ANDROID: Flutter app code, all shared Dart modules, android folder
            android:
              - 'am_app/lib/**'
              - 'am_app/android/**'
              - 'am_app/assets/**'
              - 'am_app/pubspec.yaml'
              - 'am_app/pubspec.lock'
              - 'am_app/analysis_options.yaml'
              - 'am_app/test/**'
              - 'am_library/**'
              - 'am_common/**'
              - 'am_design_system/**'
              - 'am_analysis/**'
              - 'am_market/**'
              - 'am_portfolio_ui/**'
              - 'am_trade_ui/**'
              - 'am_auth_ui/**'
              - 'am_dashboard_ui/**'
              - 'am_ai_ui/**'
              - 'am_subscription_ui/**'
              - 'am_user_ui/**'
              - 'am_diagnostic_ui/**'
              - 'am_doc_intelligence_ui/**'
              # Do NOT include unified-ci.yml here — workflow-only edits must not
              # queue Android Play env approvals (dev/preprod/prod) on main.
  security-scan:
    name: Security Scan (Secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          path: ./
          extra_args: --only-verified

  # ============================================================
  # WEB — Build & GitOps (trade-style gates; web only)
  # Push/PR web paths or force_web: build image; on main freeze am-gitops.
  # Deploy→Dev/Prod: approval via web-*; Preprod Helm skips on main+GitOps.
  # ============================================================
  web-build-gitops:
    name: Build & GitOps
    needs: [detect-changes, security-scan]
    if: |
      always() &&
      needs.security-scan.result == 'success' &&
      (needs.detect-changes.outputs.web == 'true' || inputs.force_web == true)
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: "flutter"
      working_directory: "am_app"
      build_context: ".."
      image_name: "am-modern-ui"
      preprod_namespace: "am-apps-preprod"
      prod_namespace: "am-apps-prod"
      dev_namespace: "am-apps-dev"
      deploy_dev: true
      deploy_prod: true
      # Two preprod paths: GitOps (Argo on main) and/or Helm (fixed release -preprod + Kind Vault).
      deploy_preprod: ${{ github.event_name != 'workflow_dispatch' && true || inputs.deploy_preprod_helm }}
      gitops_write_preprod: ${{ github.event_name != 'workflow_dispatch' && true || inputs.gitops_write_preprod }}
      force_preprod_helm: ${{ github.event_name == 'workflow_dispatch' && inputs.force_preprod_helm || false }}
      gitops_values_path: "am_app"
      gh_env_dev: "web-dev"
      gh_env_preprod: "web-preprod"
      gh_env_prod: "web-prod"
      skip_secrets_scan: true
      skip_iac_scan: true
      skip_vulnerability_scan: false
      no_cache: true
    secrets: inherit

  # ============================================================
  # ANDROID BUILD - only when android files changed
  # Calls central-mobile-android.yml@main (Flutter -> AAB -> Play)
  # ============================================================
  android-publish:
    name: Publish Android
    needs: [detect-changes, security-scan]
    # Run if: android files changed OR force_android manually set via workflow_dispatch
    if: |
      always() &&
      needs.security-scan.result == 'success' &&
      (needs.detect-changes.outputs.android == 'true' || inputs.force_android == true)
    permissions:
      contents: read
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-mobile-android.yml@main
    with:
      working_directory: "am_app"
      # Release AAB required for Play Internal/Production (main, develop, feature, hotfix, or manual preprod/prod)
      build_mode: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/') || (github.event_name == 'workflow_dispatch' && (inputs.target_env == 'preprod' || inputs.target_env == 'prod'))) && 'release' || 'debug' }}
      artifact_type: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/') || (github.event_name == 'workflow_dispatch' && (inputs.target_env == 'preprod' || inputs.target_env == 'prod'))) && 'appbundle' || 'apk' }}
      package_name: "com.asrax.aminvestment"
      run_analyze: true
      run_tests: true
      upload_artifact: true
      # Play Internal (preprod track) AAB talks to prod APIs
      am_domain: "am.asrax.in"
      am_env: "prod"
      # Play uploads only via workflow_dispatch + target_env (not auto on main push).
      # Avoids waiting android-dev/preprod/prod approvals after every main CI/web change.
      deploy_dev: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env == 'dev' }}
      deploy_preprod: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env == 'preprod' }}
      deploy_prod: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod' }}
      # Map environment names
      gh_env_dev: "android-dev"
      gh_env_preprod: "android-preprod"
      gh_env_prod: "android-prod"
    secrets: inherit
