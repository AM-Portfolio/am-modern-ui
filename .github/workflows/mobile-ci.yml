# Mobile CI — Android + iOS (parallel)
#
# Branch policy:
#   feature/**, develop, hotfix/**  → build artifacts only (no store upload)
#   main                            → Internal Testing then full store deploy
#                                     (Play Internal + TestFlight, then Production / App Store)
#
# Manual dispatch can force deploy flags (still prefer main for store).

name: Mobile CI

on:
  push:
    branches: ["main", "develop", "feature/**", "hotfix/**"]
    paths:
      - "am_app/**"
      - "am_common/**"
      - "am_design_system/**"
      - "am_library/**"
      - "am_auth_ui/**"
      - "am_dashboard_ui/**"
      - "am_market/**"
      - "am_portfolio_ui/**"
      - "am_trade_ui/**"
      - "am_paper_ui/**"
      - "am_user_ui/**"
      - "am_ai_ui/**"
      - "am_analysis/**"
      - "am_diagnostic_ui/**"
      - "am_doc_intelligence_ui/**"
      - "am_subscription_ui/**"
      - "am_news_ui/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "am_app/**"
      - "am_common/**"
      - "am_design_system/**"
      - "am_library/**"
      - "am_auth_ui/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force Internal+Production deploy (even off main; use carefully)"
        required: false
        type: boolean
        default: false
      reuse_codemagic_android_build_id:
        description: "Skip Flutter rebuild — download AAB from this Codemagic build and upload Play Internal only"
        required: false
        type: string
        default: ""
      sync_codemagic_play_sa:
        description: "Copy PLAY_STORE_SERVICE_ACCOUNT_JSON into Codemagic android_credentials (no build)"
        required: false
        type: boolean
        default: false
      am_domain:
        description: "Override AM_DOMAIN dart-define (empty = prod default on main)"
        required: false
        type: string
        default: ""
      am_env:
        description: "Override AM_ENV dart-define"
        required: false
        type: choice
        options:
          - ""
          - dev
          - preprod
          - prod
        default: ""

jobs:
  resolve:
    name: Resolve branch policy
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.p.outputs.deploy }}
      am_domain: ${{ steps.p.outputs.am_domain }}
      am_env: ${{ steps.p.outputs.am_env }}
      reuse_android: ${{ steps.p.outputs.reuse_android }}
      sync_play: ${{ steps.p.outputs.sync_play }}
    steps:
      - id: p
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          DEPLOY=false
          if [ "$REF" = "main" ] || [ "${{ github.event.inputs.force_deploy }}" = "true" ]; then
            DEPLOY=true
          fi
          REUSE="${{ github.event.inputs.reuse_codemagic_android_build_id }}"
          SYNC_PLAY="${{ github.event.inputs.sync_codemagic_play_sa }}"
          REUSE_ANDROID=false
          if [ -n "$REUSE" ]; then
            REUSE_ANDROID=true
            DEPLOY=false
          fi
          if [ "$SYNC_PLAY" = "true" ]; then
            DEPLOY=false
          fi
          echo "sync_play=$SYNC_PLAY" >> "$GITHUB_OUTPUT"
          DOMAIN="${{ github.event.inputs.am_domain }}"
          ENV_LABEL="${{ github.event.inputs.am_env }}"
          if [ -z "$DOMAIN" ]; then
            if [ "$DEPLOY" = "true" ] || [ "$REUSE_ANDROID" = "true" ]; then
              DOMAIN="am.asrax.in"
            else
              DOMAIN="am-preprod.asrax.in"
            fi
          fi
          if [ -z "$ENV_LABEL" ]; then
            if [ "$DEPLOY" = "true" ] || [ "$REUSE_ANDROID" = "true" ]; then
              ENV_LABEL="prod"
            else
              ENV_LABEL="preprod"
            fi
          fi
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "reuse_android=$REUSE_ANDROID" >> "$GITHUB_OUTPUT"
          echo "am_domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "am_env=$ENV_LABEL" >> "$GITHUB_OUTPUT"
          echo "Branch=$REF deploy=$DEPLOY reuse_android=$REUSE_ANDROID domain=$DOMAIN env=$ENV_LABEL"

  sync-codemagic-play-sa:
    name: Sync Play SA JSON to Codemagic
    needs: resolve
    if: ${{ needs.resolve.outputs.sync_play == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Upsert GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          APP_ID: "6ac22a8f93e6cd231a7ad1d6"
        run: |
          set -euo pipefail
          if [ -z "${CODEMAGIC_API_TOKEN:-}" ] || [ -z "${PLAY_JSON:-}" ]; then
            echo "::error::CODEMAGIC_API_TOKEN and PLAY_STORE_SERVICE_ACCOUNT_JSON required"
            exit 1
          fi
          GROUPS=$(curl -fsSL -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
            "https://codemagic.io/api/v3/apps/${APP_ID}/variable-groups")
          GID=$(echo "$GROUPS" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for g in d.get('data') or []:
            if g.get('name')=='android_credentials':
              print(g['id']); break
          ")
          if [ -z "$GID" ]; then
            CREATED=$(curl -fsSL -X POST -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"android_credentials"}' \
              "https://codemagic.io/api/v3/apps/${APP_ID}/variable-groups")
            GID=$(echo "$CREATED" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['id'])")
          fi
          BODY=$(python3 - <<'PY'
          import json,os
          print(json.dumps({"secure": True, "variables": [{"name": "GCLOUD_SERVICE_ACCOUNT_CREDENTIALS", "value": os.environ["PLAY_JSON"]}]}))
          PY
          )
          curl -fsSL -X POST -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
            -H "Content-Type: application/json" -d "$BODY" \
            "https://codemagic.io/api/v3/variable-groups/${GID}/variables"
          echo "Synced GCLOUD_SERVICE_ACCOUNT_CREDENTIALS into Codemagic group $GID"

  # No Flutter rebuild — Play Internal from previous Codemagic AAB
  android-reuse-internal:
    name: Android -> Play Internal (reuse Codemagic AAB)
    needs: resolve
    if: ${{ needs.resolve.outputs.reuse_android == 'true' }}
    runs-on: ubuntu-latest
    environment: android-internal
    permissions:
      contents: read
    steps:
      - name: Download AAB from Codemagic
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          BUILD_ID: ${{ github.event.inputs.reuse_codemagic_android_build_id }}
        run: |
          set -euo pipefail
          if [ -z "${CODEMAGIC_API_TOKEN:-}" ]; then
            echo "::error::CODEMAGIC_API_TOKEN secret required"
            exit 1
          fi
          mkdir -p android-out
          META=$(curl -fsSL -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
            "https://api.codemagic.io/builds/${BUILD_ID}")
          URL=$(echo "$META" | python3 -c "
          import json,sys
          b=json.load(sys.stdin)
          build=b.get('build', b)
          arts=build.get('artefacts') or build.get('artifacts') or []
          if isinstance(arts, dict): arts=[arts]
          for a in arts:
            name=(a.get('name') or '')
            typ=(a.get('type') or '')
            if name.endswith('.aab') or typ=='aab':
              print(a.get('url','')); break
          ")
          if [ -z "$URL" ]; then
            echo "::error::No AAB on Codemagic build ${BUILD_ID}"
            exit 1
          fi
          curl -fsSL -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" -o android-out/app-release.aab "$URL"
          ls -lh android-out/app-release.aab

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.asrax.aminvestment
          releaseFiles: android-out/*.aab
          tracks: internal
          status: completed

  validate:
    name: Common Validation
    needs: resolve
    if: ${{ needs.resolve.outputs.reuse_android != 'true' && needs.resolve.outputs.sync_play != 'true' }}
    permissions:
      contents: read
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-mobile-validate.yml@feature/mobile-android-ios-ci
    with:
      working_directory: am_app

  android:
    name: Android
    needs: [resolve, validate]
    if: ${{ needs.resolve.outputs.reuse_android != 'true' && needs.resolve.outputs.sync_play != 'true' }}
    permissions:
      contents: read
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-mobile-android.yml@feature/mobile-android-ios-ci
    with:
      working_directory: am_app
      build_mode: release
      artifact_type: appbundle
      run_analyze: false
      run_tests: false
      upload_artifact: true
      package_name: com.asrax.aminvestment
      am_domain: ${{ needs.resolve.outputs.am_domain }}
      am_env: ${{ needs.resolve.outputs.am_env }}
      deploy_internal: ${{ needs.resolve.outputs.deploy == 'true' }}
      deploy_production: ${{ needs.resolve.outputs.deploy == 'true' }}
      gh_env_preprod: android-internal
      gh_env_prod: android-prod
    secrets: inherit

  ios:
    name: iOS
    needs: [resolve, validate]
    if: ${{ needs.resolve.outputs.reuse_android != 'true' && needs.resolve.outputs.sync_play != 'true' }}
    permissions:
      contents: read
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-mobile-ios.yml@feature/mobile-android-ios-ci
    with:
      working_directory: am_app
      build_mode: release
      run_analyze: false
      run_tests: false
      upload_artifact: true
      bundle_id: com.asrax.aminvestment
      am_domain: ${{ needs.resolve.outputs.am_domain }}
      am_env: ${{ needs.resolve.outputs.am_env }}
      deploy_internal: ${{ needs.resolve.outputs.deploy == 'true' }}
      deploy_production: ${{ needs.resolve.outputs.deploy == 'true' }}
      gh_env_internal: ios-internal
      gh_env_prod: ios-prod
    secrets: inherit
