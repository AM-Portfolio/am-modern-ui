# Mobile CI — Android + iOS (parallel), GitHub-owned Internal Testing
#
# Branch policy:
#   feature/**, develop, hotfix/**  → build artifacts only
#   workflow_dispatch deploy_internal → Play Internal (Android, no Codemagic)
#   main                            → Play Internal, then Play Production
#   iOS TestFlight                  → Codemagic manual / main until GH mac runner
#
# Pipelines ref: AM-Portfolio/am-pipelines@feature/mobile-android-ios-ci

name: Mobile CI

on:
  push:
    branches: ["main", "develop", "feature/**", "hotfix/**"]
    paths:
      - "am_app/**"
      - "am_common/**"
      - "am_design_system/**"
      - "am_library/**"
      - "am_auth_ui/**"
      - "am_dashboard_ui/**"
      - "am_market/**"
      - "am_portfolio_ui/**"
      - "am_trade_ui/**"
      - "am_paper_ui/**"
      - "am_user_ui/**"
      - "am_ai_ui/**"
      - "am_analysis/**"
      - "am_diagnostic_ui/**"
      - "am_doc_intelligence_ui/**"
      - "am_subscription_ui/**"
      - "am_news_ui/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "am_app/**"
      - "am_common/**"
      - "am_design_system/**"
      - "am_library/**"
      - "am_auth_ui/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:
    inputs:
      deploy_internal:
        description: "Upload Android AAB to Play Internal Testing (GitHub-native, no Codemagic)"
        required: false
        type: boolean
        default: false
      force_deploy:
        description: "Force Internal+Production deploy (even off main; use carefully)"
        required: false
        type: boolean
        default: false
      am_domain:
        description: "Override AM_DOMAIN dart-define (empty = prod default when deploying)"
        required: false
        type: string
        default: ""
      am_env:
        description: "Override AM_ENV dart-define"
        required: false
        type: choice
        options:
          - ""
          - dev
          - preprod
          - prod
        default: ""

jobs:
  resolve:
    name: Resolve branch policy
    runs-on: ubuntu-latest
    outputs:
      deploy_internal: ${{ steps.p.outputs.deploy_internal }}
      deploy_production: ${{ steps.p.outputs.deploy_production }}
      am_domain: ${{ steps.p.outputs.am_domain }}
      am_env: ${{ steps.p.outputs.am_env }}
    steps:
      - id: p
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          FORCE="${{ github.event.inputs.force_deploy }}"
          DISPATCH_INTERNAL="${{ github.event.inputs.deploy_internal }}"

          DEPLOY_INTERNAL=false
          DEPLOY_PRODUCTION=false

          if [ "$REF" = "main" ] || [ "$FORCE" = "true" ]; then
            DEPLOY_INTERNAL=true
            DEPLOY_PRODUCTION=true
          elif [ "$DISPATCH_INTERNAL" = "true" ]; then
            DEPLOY_INTERNAL=true
            DEPLOY_PRODUCTION=false
          fi

          DOMAIN="${{ github.event.inputs.am_domain }}"
          ENV_LABEL="${{ github.event.inputs.am_env }}"
          if [ -z "$DOMAIN" ]; then
            if [ "$DEPLOY_INTERNAL" = "true" ] || [ "$DEPLOY_PRODUCTION" = "true" ]; then
              DOMAIN="am.asrax.in"
            else
              DOMAIN="am-preprod.asrax.in"
            fi
          fi
          if [ -z "$ENV_LABEL" ]; then
            if [ "$DEPLOY_INTERNAL" = "true" ] || [ "$DEPLOY_PRODUCTION" = "true" ]; then
              ENV_LABEL="prod"
            else
              ENV_LABEL="preprod"
            fi
          fi

          echo "deploy_internal=$DEPLOY_INTERNAL" >> "$GITHUB_OUTPUT"
          echo "deploy_production=$DEPLOY_PRODUCTION" >> "$GITHUB_OUTPUT"
          echo "am_domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "am_env=$ENV_LABEL" >> "$GITHUB_OUTPUT"
          echo "Branch=$REF deploy_internal=$DEPLOY_INTERNAL deploy_production=$DEPLOY_PRODUCTION domain=$DOMAIN env=$ENV_LABEL"

  validate:
    name: Common Validation
    needs: resolve
    permissions:
      contents: read
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-mobile-validate.yml@feature/mobile-android-ios-ci
    with:
      working_directory: am_app

  android:
    name: Android
    needs: [resolve, validate]
    permissions:
      contents: read
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-mobile-android.yml@feature/mobile-android-ios-ci
    with:
      working_directory: am_app
      build_mode: release
      artifact_type: appbundle
      run_analyze: false
      run_tests: false
      upload_artifact: true
      package_name: com.asrax.aminvestment
      am_domain: ${{ needs.resolve.outputs.am_domain }}
      am_env: ${{ needs.resolve.outputs.am_env }}
      deploy_internal: ${{ needs.resolve.outputs.deploy_internal == 'true' }}
      deploy_production: ${{ needs.resolve.outputs.deploy_production == 'true' }}
      gh_env_preprod: android-internal
      gh_env_prod: android-prod
    secrets: inherit

  # iOS: build + artifact only until dedicated GitHub mac runner.
  # TestFlight remains Codemagic manual / main backup (ios-testflight workflow).
  ios:
    name: iOS
    needs: [resolve, validate]
    permissions:
      contents: read
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-mobile-ios.yml@feature/mobile-android-ios-ci
    with:
      working_directory: am_app
      build_mode: release
      run_analyze: false
      run_tests: false
      upload_artifact: true
      bundle_id: com.asrax.aminvestment
      am_domain: ${{ needs.resolve.outputs.am_domain }}
      am_env: ${{ needs.resolve.outputs.am_env }}
      deploy_internal: false
      deploy_production: false
      gh_env_internal: ios-internal
      gh_env_prod: ios-prod
    secrets: inherit
