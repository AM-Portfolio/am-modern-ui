# Mobile CI — Android + iOS (parallel), GitHub-owned store ladder
#
# Branch policy:
#   non-main branch push → Play Internal + TestFlight (dev backend)
#   main → one prod-backed build per platform, promoted through testing and production
#   Codemagic: no auto builds — use codemagic-fallback.yml (approval) only
#
# Pipelines ref: AM-Portfolio/am-pipelines@main

name: Mobile CI

on:
  push:
    branches: ["**"]
    paths:
      - "am_app/**"
      - "am_common/**"
      - "am_design_system/**"
      - "am_library/**"
      - "am_auth_ui/**"
      - "am_dashboard_ui/**"
      - "am_market/**"
      - "am_portfolio_ui/**"
      - "am_trade_ui/**"
      - "am_paper_ui/**"
      - "am_user_ui/**"
      - "am_ai_ui/**"
      - "am_analysis/**"
      - "am_diagnostic_ui/**"
      - "am_doc_intelligence_ui/**"
      - "am_subscription_ui/**"
      - "am_news_ui/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "am_app/**"
      - "am_common/**"
      - "am_design_system/**"
      - "am_library/**"
      - "am_auth_ui/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:
    inputs:
      run_android:
        description: "Enable Android for the selected manual release"
        required: false
        type: boolean
        default: true
      run_ios:
        description: "Enable iOS for the selected manual release"
        required: false
        type: boolean
        default: true
      deploy_internal:
        description: "Manual Play Internal + TestFlight release (no production)"
        required: false
        type: boolean
        default: false
      deploy_testflight:
        description: "Manual iOS TestFlight release only (no production)"
        required: false
        type: boolean
        default: false
      deploy_production:
        description: "Main only: Internal + TestFlight, then Play Production + App Store"
        required: false
        type: boolean
        default: false
      skip_validate:
        description: "Skip Common Validation (faster iOS/Android-only debug; keep false on main store ladder)"
        required: false
        type: boolean
        default: false

jobs:
  resolve:
    name: Resolve branch policy
    runs-on: ubuntu-latest
    outputs:
      run_android: ${{ steps.p.outputs.run_android }}
      run_ios: ${{ steps.p.outputs.run_ios }}
      deploy_android_internal: ${{ steps.p.outputs.deploy_android_internal }}
      deploy_android_production: ${{ steps.p.outputs.deploy_android_production }}
      deploy_ios_testflight: ${{ steps.p.outputs.deploy_ios_testflight }}
      deploy_ios_production: ${{ steps.p.outputs.deploy_ios_production }}
      version_code_offset: ${{ steps.p.outputs.version_code_offset }}
      skip_validate: ${{ steps.p.outputs.skip_validate }}
    steps:
      - id: p
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          EVENT="${{ github.event_name }}"
          DISPATCH_INTERNAL="${{ github.event.inputs.deploy_internal }}"
          DISPATCH_TF="${{ github.event.inputs.deploy_testflight }}"
          DISPATCH_PRODUCTION="${{ github.event.inputs.deploy_production }}"

          RUN_ANDROID=true
          RUN_IOS=true
          SKIP_VALIDATE=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            RUN_ANDROID="${{ github.event.inputs.run_android }}"
            RUN_IOS="${{ github.event.inputs.run_ios }}"
            SKIP_VALIDATE="${{ github.event.inputs.skip_validate }}"
            [ -z "$RUN_ANDROID" ] && RUN_ANDROID=true
            [ -z "$RUN_IOS" ] && RUN_IOS=true
            [ -z "$SKIP_VALIDATE" ] && SKIP_VALIDATE=false
          fi

          DEPLOY_ANDROID_INTERNAL=false
          DEPLOY_ANDROID_PRODUCTION=false
          DEPLOY_IOS_TF=false
          DEPLOY_IOS_PRODUCTION=false

          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DISPATCH_PRODUCTION" = "true" ] && [ "$REF" != "main" ]; then
            echo "::error::Production deployment is available only from main"
            exit 1
          fi

          if [ "$REF" = "main" ] && [ "$EVENT" = "push" ]; then
            # Main pushes keep the full automatic release ladder.
            DEPLOY_ANDROID_INTERNAL=true
            DEPLOY_ANDROID_PRODUCTION=true
            DEPLOY_IOS_TF=true
            DEPLOY_IOS_PRODUCTION=true
          elif [ "$EVENT" = "push" ]; then
            # Every pushed code branch is distributed to testers; production stays main-only.
            DEPLOY_ANDROID_INTERNAL=true
            DEPLOY_IOS_TF=true
          else
            # Manual runs with no release option selected perform validation only.
            # Production includes the tester gates.
            if [ "$DISPATCH_INTERNAL" = "true" ]; then
              DEPLOY_ANDROID_INTERNAL=true
              DEPLOY_IOS_TF=true
            fi
            if [ "$DISPATCH_TF" = "true" ]; then
              DEPLOY_IOS_TF=true
            fi
            if [ "$DISPATCH_PRODUCTION" = "true" ]; then
              DEPLOY_ANDROID_INTERNAL=true
              DEPLOY_ANDROID_PRODUCTION=true
              DEPLOY_IOS_TF=true
              DEPLOY_IOS_PRODUCTION=true
            fi
          fi

          if [ "$RUN_ANDROID" != "true" ]; then
            DEPLOY_ANDROID_INTERNAL=false
            DEPLOY_ANDROID_PRODUCTION=false
          fi
          if [ "$RUN_IOS" != "true" ]; then
            DEPLOY_IOS_TF=false
            DEPLOY_IOS_PRODUCTION=false
          fi
          if [ "$REF" != "main" ]; then
            DEPLOY_IOS_PRODUCTION=false
            DEPLOY_ANDROID_PRODUCTION=false
          fi

          # Internal testing and production promote the same versioned binary.
          VERSION_CODE_OFFSET="$GITHUB_RUN_NUMBER"

          {
            echo "run_android=$RUN_ANDROID"
            echo "run_ios=$RUN_IOS"
            echo "deploy_android_internal=$DEPLOY_ANDROID_INTERNAL"
            echo "deploy_android_production=$DEPLOY_ANDROID_PRODUCTION"
            echo "deploy_ios_testflight=$DEPLOY_IOS_TF"
            echo "deploy_ios_production=$DEPLOY_IOS_PRODUCTION"
            echo "version_code_offset=$VERSION_CODE_OFFSET"
            echo "skip_validate=$SKIP_VALIDATE"
          } >> "$GITHUB_OUTPUT"
          echo "Branch=$REF run_android=$RUN_ANDROID run_ios=$RUN_IOS android_internal=$DEPLOY_ANDROID_INTERNAL android_prod=$DEPLOY_ANDROID_PRODUCTION ios_tf=$DEPLOY_IOS_TF ios_prod=$DEPLOY_IOS_PRODUCTION version_offset=$VERSION_CODE_OFFSET skip_validate=$SKIP_VALIDATE"

  validate:
    name: Common Validation
    needs: resolve
    if: ${{ (needs.resolve.outputs.run_android == 'true' || needs.resolve.outputs.run_ios == 'true') && needs.resolve.outputs.skip_validate != 'true' }}
    permissions:
      contents: read
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-mobile-validate.yml@main
    with:
      working_directory: am_app
      flutter_version: "3.44.0"

  android:
    name: Android -> Build and release
    needs: [resolve, validate]
    if: ${{ always() && !cancelled() && needs.resolve.outputs.run_android == 'true' && (needs.resolve.outputs.deploy_android_internal == 'true' || needs.resolve.outputs.deploy_android_production == 'true') && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    permissions:
      contents: read
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-mobile-android.yml@main
    with:
      working_directory: am_app
      build_mode: release
      artifact_type: appbundle
      run_analyze: false
      run_tests: false
      upload_artifact: true
      package_name: com.asrax.aminvestment
      am_domain: ${{ github.ref_name == 'main' && 'am.asrax.in' || 'am-dev.asrax.in' }}
      am_env: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      version_code_offset: ${{ fromJSON(needs.resolve.outputs.version_code_offset) }}
      deploy_internal: ${{ needs.resolve.outputs.deploy_android_internal == 'true' }}
      deploy_production: ${{ needs.resolve.outputs.deploy_android_production == 'true' }}
      gh_env_preprod: android-internal
      gh_env_prod: android-prod
      flutter_version: "3.44.0"
    secrets: inherit

  ios:
    name: iOS -> Build and release
    needs: [resolve, validate]
    if: ${{ always() && !cancelled() && needs.resolve.outputs.run_ios == 'true' && (needs.resolve.outputs.deploy_ios_testflight == 'true' || needs.resolve.outputs.deploy_ios_production == 'true') && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    permissions:
      contents: read
      actions: read
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-mobile-ios.yml@main
    with:
      working_directory: am_app
      build_mode: release
      run_analyze: false
      run_tests: false
      upload_artifact: true
      keep_artifact: true
      bundle_id: com.asrax.aminvestment
      am_domain: ${{ github.ref_name == 'main' && 'am.asrax.in' || 'am-dev.asrax.in' }}
      am_env: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      version_code_offset: ${{ fromJSON(needs.resolve.outputs.version_code_offset) }}
      deploy_internal: ${{ needs.resolve.outputs.deploy_ios_testflight == 'true' }}
      deploy_production: ${{ needs.resolve.outputs.deploy_ios_production == 'true' }}
      gh_env_internal: ios-internal
      gh_env_prod: ios-prod
      flutter_version: "3.44.0"
    secrets: inherit
