<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AM Investment Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="am_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AM Investment Platform</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" crossorigin>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0f18;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      touch-action: pan-x pan-y pinch-zoom;
    }
    /* The app handles pinch itself so it can keep the gesture focal point fixed. */
    flt-glass-pane {
      touch-action: none !important;
    }
    flutter-view {
      overflow: visible !important;
    }
    #am-boot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      color: #e2e8f0;
      gap: 22px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 42%, #121a2a 0%, #0b0f18 70%);
    }
    #am-boot .brand {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #am-boot .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.08);
      box-sizing: border-box;
    }
    #am-boot .ring-spin {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: #1de9b6;
      border-right-color: rgba(29,233,182,0.35);
      box-sizing: border-box;
      animation: am-spin 2.2s linear infinite;
    }
    #am-boot .ring-spin-inner {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: rgba(29,233,182,0.45);
      box-sizing: border-box;
      animation: am-spin-rev 1.8s linear infinite;
    }
    #am-boot .logo {
      width: 148px;
      height: 96px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 16px;
      padding: 10px 14px;
      box-sizing: border-box;
      box-shadow: 0 0 18px rgba(29,233,182,0.18);
      animation: am-pulse 1.6s ease-in-out infinite alternate;
    }
    #am-boot-msg {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #e2e8f0;
      margin: 0;
    }
    #am-boot-sub {
      margin: -10px 0 0;
      font-size: 13px;
      color: #94a3b8;
      font-weight: 400;
    }
    #am-boot-error {
      display: none;
      max-width: 720px;
      color: #fecaca;
      white-space: pre-wrap;
      text-align: left;
      background: rgba(127,29,29,0.35);
      border: 1px solid rgba(248,113,113,0.35);
      border-radius: 12px;
      padding: 16px;
    }
    @keyframes am-spin { to { transform: rotate(360deg); } }
    @keyframes am-spin-rev { to { transform: rotate(-360deg); } }
    @keyframes am-pulse {
      from { transform: scale(0.96); opacity: 0.85; }
      to { transform: scale(1.04); opacity: 1; }
    }

    @media (prefers-color-scheme: light) {
      html, body { background: #f4f6fa; }
      #am-boot {
        color: #0f172a;
        background:
          radial-gradient(ellipse at 50% 42%, #ffffff 0%, #f4f6fa 70%);
      }
      #am-boot .ring { border-color: rgba(15,23,42,0.08); }
      #am-boot .ring-spin {
        border-top-color: #0d9488;
        border-right-color: rgba(13,148,136,0.35);
      }
      #am-boot .ring-spin-inner { border-bottom-color: rgba(13,148,136,0.4); }
      #am-boot .logo {
        box-shadow: 0 4px 16px rgba(15,23,42,0.08);
      }
      #am-boot-msg { color: #0f172a; }
      #am-boot-sub { color: #64748b; }
    }
  </style>
</head>
<body>
  <div id="am-boot">
    <div class="brand" aria-hidden="true">
      <div class="ring"></div>
      <div class="ring-spin"></div>
      <div class="ring-spin-inner"></div>
      <img class="logo" src="logos/app_logo.png" alt="ASRAX" width="148" height="96"
           onerror="this.style.display='none'">
    </div>
    <p id="am-boot-msg">Loading AM Investment Platform…</p>
    <p id="am-boot-sub">Preparing your workspace</p>
    <pre id="am-boot-error"></pre>
  </div>

  <script>
    var AM_BUILD_ID = 'local';
    window.__AM_BOOT_T0__ = performance.now();
    window.__AM_BOOT_TRACE__ = window.__AM_BOOT_TRACE__ || { marks: {} };

    (function () {
      var msg = document.getElementById('am-boot-msg');
      var sub = document.getElementById('am-boot-sub');
      if (msg && location.pathname.indexOf('/app/') === 0) {
        msg.textContent = 'Restoring your session…';
        if (sub) sub.textContent = 'Signing you back into AM securely';
      }
    })();

    function bootTraceEnabled() {
      try {
        if (new URLSearchParams(location.search).get('bootTrace') === '1') return true;
        return localStorage.getItem('am_boot_trace') === '1';
      } catch (e) {
        return false;
      }
    }

    function bootMark(name) {
      var ms = Math.round(performance.now() - window.__AM_BOOT_T0__);
      window.__AM_BOOT_TRACE__.marks[name] = ms;
      if (bootTraceEnabled()) {
        console.log('[BootTrace] ' + name + ' @ ' + ms + 'ms (html)');
      }
    }

    bootMark('html_loaded');

    // Flutter preventDefault's every wheel event, which blocks Brave/Chrome
    // Flutter's canvas does not reliably preserve native browser pinch focus.
    // Scale the complete view around the cursor or the midpoint of the fingers.
    window.__amChartCtrlWheel = false;
    var amPageZoom = 1;
    var amPageZoomX = 0;
    var amPageZoomY = 0;
    var amTouchPinch = null;

    function amZoomSurface() {
      return document.querySelector('flutter-view');
    }

    function applyAmPageZoom(surface) {
      surface.style.transformOrigin = '0 0';
      surface.style.transform =
        'translate(' + amPageZoomX + 'px, ' + amPageZoomY + 'px) ' +
        'scale(' + amPageZoom + ')';
    }

    window.addEventListener('wheel', function (e) {
      if (!(e.ctrlKey || e.metaKey)) return;
      if (window.__amChartCtrlWheel) {
        e.preventDefault();
        return;
      }
      var surface = amZoomSurface();
      if (!surface) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      var delta = e.deltaY;
      if (e.deltaMode === 1) delta *= 16;
      if (e.deltaMode === 2) delta *= window.innerHeight;
      if (!delta) return;

      var zoomAmount = Math.min(0.15, Math.max(0.01, Math.abs(delta) * 0.008));
      var nextZoom = Math.max(0.67, Math.min(
        2.0,
        amPageZoom * Math.exp(-Math.sign(delta) * zoomAmount)
      ));
      if (nextZoom === amPageZoom) return;
      var bounds = surface.getBoundingClientRect();
      var originX = bounds.left - amPageZoomX;
      var originY = bounds.top - amPageZoomY;
      var contentX = (e.clientX - originX - amPageZoomX) / amPageZoom;
      var contentY = (e.clientY - originY - amPageZoomY) / amPageZoom;
      amPageZoomX = e.clientX - originX - contentX * nextZoom;
      amPageZoomY = e.clientY - originY - contentY * nextZoom;
      amPageZoom = nextZoom;
      applyAmPageZoom(surface);
    }, { capture: true, passive: false });

    function amTouchDistance(touches) {
      var dx = touches[1].clientX - touches[0].clientX;
      var dy = touches[1].clientY - touches[0].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function amTouchCenter(touches) {
      return {
        x: (touches[0].clientX + touches[1].clientX) / 2,
        y: (touches[0].clientY + touches[1].clientY) / 2
      };
    }

    window.addEventListener('touchstart', function (e) {
      if (e.touches.length < 2) return;
      var surface = amZoomSurface();
      if (!surface) return;
      var center = amTouchCenter(e.touches);
      var bounds = surface.getBoundingClientRect();
      var originX = bounds.left - amPageZoomX;
      var originY = bounds.top - amPageZoomY;
      amTouchPinch = {
        distance: Math.max(1, amTouchDistance(e.touches)),
        zoom: amPageZoom,
        contentX: (center.x - originX - amPageZoomX) / amPageZoom,
        contentY: (center.y - originY - amPageZoomY) / amPageZoom,
        originX: originX,
        originY: originY,
        surface: surface
      };
      e.preventDefault();
    }, { capture: true, passive: false });

    window.addEventListener('touchmove', function (e) {
      if (!amTouchPinch || e.touches.length < 2) return;
      e.preventDefault();
      var center = amTouchCenter(e.touches);
      var nextZoom = Math.max(0.67, Math.min(
        2.0,
        amTouchPinch.zoom * amTouchDistance(e.touches) / amTouchPinch.distance
      ));
      amPageZoomX = center.x - amTouchPinch.originX -
        amTouchPinch.contentX * nextZoom;
      amPageZoomY = center.y - amTouchPinch.originY -
        amTouchPinch.contentY * nextZoom;
      amPageZoom = nextZoom;
      applyAmPageZoom(amTouchPinch.surface);
    }, { capture: true, passive: false });

    window.addEventListener('touchend', function (e) {
      if (e.touches.length < 2) amTouchPinch = null;
    }, { capture: true, passive: false });
    window.addEventListener('touchcancel', function () {
      amTouchPinch = null;
    }, { capture: true, passive: false });

    // Only purge stale service workers when build version changes.
    if ('serviceWorker' in navigator) {
      var storedBuild = null;
      try { storedBuild = localStorage.getItem('am_build_id'); } catch (e) {}
      if (storedBuild !== AM_BUILD_ID) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        });
        try { localStorage.setItem('am_build_id', AM_BUILD_ID); } catch (e) {}
      }
    }

    function showBootError(message) {
      var boot = document.getElementById('am-boot');
      var err = document.getElementById('am-boot-error');
      if (boot) boot.style.display = 'flex';
      if (err) {
        err.style.display = 'block';
        err.textContent = message;
      }
    }

    window.addEventListener('error', function (event) {
      showBootError('JavaScript error: ' + (event.message || event));
    });

    window.addEventListener('unhandledrejection', function (event) {
      showBootError('Unhandled promise rejection: ' + (event.reason || event));
    });

    document.addEventListener('dart-app-ready', function () {
      bootMark('flutter_dart_ready');
      var boot = document.getElementById('am-boot');
      if (boot) boot.remove();
    });
  </script>
  <!-- Required by Google Sign-In web (GIS). Popup OAuth also works without it,
       but google_signin_service_web initializes accounts.id when present. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="flutter_bootstrap.js?v=local" async></script>
</body>
</html>
