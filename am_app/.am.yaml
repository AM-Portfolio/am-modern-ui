name: am-modern-ui
release: am-modern-ui
# CI publishes nested GHCR: ghcr.io/am-portfolio/am-modern-ui/am-modern-ui:<tag>
image: ghcr.io/am-portfolio/am-modern-ui/am-modern-ui
runtime: flutter
language: flutter
# Dockerfile COPYs sibling packages (am_common, …) — build from repo root
dockerfile: Dockerfile
context: ..
port: 8080
github:
  repo: AM-Portfolio/am-modern-ui
  deploy_workflow: deploy-modern-ui.yml
  service: am-modern-ui
  ref: main
deploy:
  via: helm
  rebuild: on-change
