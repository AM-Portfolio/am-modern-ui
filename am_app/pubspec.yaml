name: am_app
description: AM Investment Platform - Lightweight orchestration shell
publish_to: "none"
version: 2.0.0+10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Shared Core
  am_design_system:
    path: ../am_design_system
  am_library:
    path: ../am_library
  am_common:
    path: ../am_common

  # ── FEATURE MODULES (v2.0.0 Active) ──────────────────────────────────────────
  am_auth_ui:
    path: ../am_auth_ui
  am_dashboard_ui:
    path: ../am_dashboard_ui
  am_subscription_ui:
    path: ../am_subscription_ui
  am_user_ui:
    path: ../am_user_ui
  am_portfolio_ui:
    path: ../am_portfolio_ui
  am_trade_ui:
    path: ../am_trade_ui
  am_ai_ui:
    path: ../am_ai_ui
  am_doc_intelligence_ui:
    path: ../am_doc_intelligence_ui
  am_market_ui:
    path: ../am_market/ui
  am_diagnostic_ui:
    path: ../am_diagnostic_ui
  am_analysis_ui:
    path: ../am_analysis/ui
  am_analysis_core:
    path: ../am_analysis/common
  # am_common_flutter:
  #   path: ../../am-common-flutter

  # State Management
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^3.0.3

  # DI
  get_it: ^9.1.1

  # Navigation
  go_router: ^14.0.0

  # Utils
  intl: ^0.20.2
  dio: ^5.4.0
  webview_flutter: ^4.9.0
  # webview_flutter_web: ^0.2.3+4
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon_new.jpg"
    background_color: "#15161A"
    theme_color: "#15161A"
  image_path: "assets/images/app_icon_new.jpg"

dependency_overrides:
  path_provider_foundation: 2.3.2
