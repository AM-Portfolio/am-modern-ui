# Prod Environment — am-modern-ui
# Prod app host (prep). Do not remove munish from infra Traefik.
environment: prod

appConfig:
  domain: "am.asrax.in"
  googleWebClientId: ""
  googleIosClientId: ""
  googleAndroidClientId: ""
  growthbook:
    enabled: true
    apiHost: "https://growthbook.asrax.in/gbapi"
    clientKey: "sdk-Cwr4MxBl0iqnKZJ"

replicaCount: 1

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /
          pathType: Prefix
