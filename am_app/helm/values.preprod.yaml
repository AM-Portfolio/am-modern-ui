# Preprod Environment — am-modern-ui
# Preprod app host only — am.asrax.in reserved for prod
environment: preprod

appConfig:
  domain: "am-preprod.asrax.in"
  googleWebClientId: ""
  googleIosClientId: ""
  googleAndroidClientId: ""
  growthbook:
    enabled: true
    apiHost: "https://growthbook.asrax.in/gbapi"
    clientKey: ""

replicaCount: 1

# Nginx SPA — probe "/" (not /health)
probes:
  port: 8080
  startup:
    path: "/"
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    path: "/"
  readiness:
    path: "/"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd
  hosts:
    - host: am-preprod.asrax.in
      paths:
        - path: /
          pathType: Prefix
