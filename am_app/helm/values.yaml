global:
  image:
    imagePullSecrets:
      - name: github-registry-secret

replicaCount: 1
service:
  port: 8080
language: flutter

# Canonical env for config.json + telemetry: dev | preprod | prod
environment: prod

appConfig:
  domain: "am.asrax.in"
  # Runtime Google Sign-In client ids (fed dynamically via Vault at runtime)
  googleWebClientId: ""
  googleIosClientId: ""
  googleAndroidClientId: ""
  growthbook:
    enabled: true
    apiHost: "https://growthbook.asrax.in/gbapi"
    # Set via Contabo CI helm param from GitHub secret GROWTHBOOK_CLIENT_KEY
    clientKey: ""

configMap:
  enabled: true
  mountPath: /usr/share/nginx/html/config.json
  subPath: config.json

image:
  repository: am-modern-ui
  pullPolicy: Always
  tag: "latest"

ingress:
  enabled: true
  className: "traefik"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

config:
  # Legacy key; chart uses top-level `environment` for config.json env.
  env: "prod"

vault:
  enabled: false
