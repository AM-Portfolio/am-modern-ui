# Codemagic CI/CD Configuration for AM Modern UI (Flutter Monorepo)
# App Name: am-modern-ui
# Bundle ID / Package Name: com.asrax.aminvestment

workflows:
  android-workflow:
    name: Android Release Build & Distribution
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.asrax.aminvestment"
        AM_DOMAIN: "am.asrax.in"
        AM_ENV: "prod"
      groups:
        - android_credentials
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'feature/**'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true

    scripts:
      - name: Disable Flutter Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean build directory
        script: |
          rm -rf am_app/build build 2>/dev/null || true

      - name: Resolve pub dependencies across monorepo
        script: |
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            echo "Running pub get in $dir..."
            (cd "$dir" && flutter pub get)
          done

      - name: Run build_runner code generation across all packages
        script: |
          set -euo pipefail
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            if grep -q "build_runner" "$dir/pubspec.yaml"; then
              echo "Running build_runner in $dir..."
              (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
            fi
          done
          # Fail closed: Freezed outputs are gitignored; AAB must see generated getters.
          test -f am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
          grep -q "coversEtfSymbol" am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
          echo "Freezed BasketLineDetail getters OK"

      - name: Setup Android Keystore & key.properties
        script: |
          KEYSTORE_B64="${ANDROID_KEYSTORE_BASE64:-}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Decoding Keystore..."
            echo "$KEYSTORE_B64" | base64 -d > am_app/android/app/am_investment_keystore.jks 2>/dev/null || echo "$KEYSTORE_B64" | base64 --decode > am_app/android/app/am_investment_keystore.jks 2>/dev/null || true
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD:-}" > am_app/android/key.properties
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-}" >> am_app/android/key.properties
            echo "keyAlias=${ANDROID_KEY_ALIAS:-}" >> am_app/android/key.properties
            echo "storeFile=am_investment_keystore.jks" >> am_app/android/key.properties
          else
            echo "Keystore secret empty — building release bundle with default/debug signing"
          fi

      - name: Build Android App Bundle (AAB)
        script: |
          cd am_app
          rm -rf build 2>/dev/null || true
          BUILD_NUM=${BUILD_NUMBER:-1}
          flutter build appbundle --release \
            --build-name="2.0.0" \
            --build-number="$BUILD_NUM" \
            --dart-define="AM_DOMAIN=${AM_DOMAIN}" \
            --dart-define="AM_ENV=${AM_ENV}"

    artifacts:
      - am_app/build/app/outputs/bundle/**/*.aab
      - am_app/build/app/outputs/apk/**/*.apk

    # Google Play publish intentionally omitted (email only). Empty UI
    # googlePlay credentials previously failed builds with JSON parse errors.
    publishing:
      email:
        recipients:
          - admin@asrax.in
        notify:
          failure: true
          success: true

  ios-workflow:
    name: iOS Release Build & Distribution
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.asrax.aminvestment"
        AM_DOMAIN: "am.asrax.in"
        AM_ENV: "prod"
      # ios_credentials omitted: incomplete ASC vars + UI ASC publisher caused
      # "integration requires app_store_connect" / identity validation failures.
      # Re-add only when KEY_ID + ISSUER_ID + private key are all valid.
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'feature/**'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true

    scripts:
      - name: Disable Flutter Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean build directory and duplicate files
        script: |
          rm -rf am_app/build build 2>/dev/null || true
          find am_app/ios -name "* 2.*" -delete 2>/dev/null || true

      - name: Resolve pub dependencies across monorepo
        script: |
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            echo "Running pub get in $dir..."
            (cd "$dir" && flutter pub get)
          done

      - name: Run build_runner code generation across all packages
        script: |
          set -euo pipefail
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            if grep -q "build_runner" "$dir/pubspec.yaml"; then
              echo "Running build_runner in $dir..."
              (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
            fi
          done
          test -f am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
          grep -q "coversEtfSymbol" am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
          echo "Freezed BasketLineDetail getters OK"

      - name: Install CocoaPods
        script: |
          (cd am_app && flutter pub get)
          cd am_app/ios
          pod install

      # Signed IPA only when full ASC key triad is present. Incomplete ios_credentials
      # (KEY_ID/ISSUER without private key / team) previously triggered identity errors.
      # Publishing stays email-only — never App Store Connect auth:integration here.
      - name: Setup iOS Signing & Build IPA
        script: |
          set -euo pipefail
          cd am_app
          rm -rf build 2>/dev/null || true
          BUILD_NUM=${BUILD_NUMBER:-1}
          HAS_ASC_KEY_ID="${APP_STORE_CONNECT_KEY_IDENTIFIER:-${APP_STORE_CONNECT_API_KEY_ID:-}}"
          HAS_ASC_ISSUER="${APP_STORE_CONNECT_ISSUER_ID:-}"
          HAS_ASC_KEY="${APP_STORE_CONNECT_PRIVATE_KEY:-${CERTIFICATE_PRIVATE_KEY:-}}"
          if [ -n "$HAS_ASC_KEY_ID" ] && [ -n "$HAS_ASC_ISSUER" ] && [ -n "$HAS_ASC_KEY" ]; then
            echo "Setting up App Store Connect code signing..."
            keychain initialize
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project use-profiles
            flutter build ipa --release \
              --build-name="2.0.0" \
              --build-number="$BUILD_NUM" \
              --dart-define="AM_DOMAIN=${AM_DOMAIN}" \
              --dart-define="AM_ENV=${AM_ENV}"
          else
            echo "ASC incomplete or empty — unsigned iOS build (feature CI / no ASC integration)"
            flutter build ios --no-codesign --release \
              --build-name="2.0.0" \
              --build-number="$BUILD_NUM" \
              --dart-define="AM_DOMAIN=${AM_DOMAIN}" \
              --dart-define="AM_ENV=${AM_ENV}"
          fi

    artifacts:
      - am_app/build/ios/ipa/*.ipa
      - am_app/build/ios/iphoneos/*.app

    # Email only. Do not add app_store_connect publishing here — UI Default
    # Workflow ASC "integration" auth fails yaml validation without integrations.
    publishing:
      email:
        recipients:
          - admin@asrax.in
        notify:
          failure: true
          success: true
