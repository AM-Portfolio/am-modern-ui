# Codemagic CI/CD Configuration for AM Modern UI (Flutter Monorepo)
# App Name: am-modern-ui
# Bundle ID / Package Name: com.asrax.aminvestment

workflows:
  android-workflow:
    name: Android Release Build & Distribution
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.asrax.aminvestment"
        AM_DOMAIN: "am.asrax.in"
        AM_ENV: "prod"
      groups:
        - android_credentials # Codemagic environment variable group for keystore & play store secrets
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'feature/**'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true

    scripts:
      - name: Disable Flutter Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Resolve pub dependencies across monorepo
        script: |
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {})
          for dir in $dirs; do
            echo "Running pub get in $dir..."
            (cd "$dir" && flutter pub get)
          done

      - name: Run build_runner code generation
        script: |
          cd am_app
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          fi

      - name: Setup Android Keystore & key.properties
        script: |
          KEYSTORE_B64="${ANDROID_KEYSTORE_BASE64:-}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Decoding Keystore..."
            echo "$KEYSTORE_B64" | base64 -d > am_app/android/app/am_investment_keystore.jks 2>/dev/null || echo "$KEYSTORE_B64" | base64 --decode > am_app/android/app/am_investment_keystore.jks 2>/dev/null || true
            cat <<EOF > am_app/android/key.properties
storePassword=${ANDROID_KEYSTORE_PASSWORD:-}
keyPassword=${ANDROID_KEY_PASSWORD:-}
keyAlias=${ANDROID_KEY_ALIAS:-}
storeFile=am_investment_keystore.jks
EOF
          else
            echo "Keystore secret empty — building release bundle with default/debug signing"
          fi

      - name: Build Android App Bundle (AAB)
        script: |
          cd am_app
          BUILD_NUM=${BUILD_NUMBER:-1}
          flutter build appbundle --release \
            --build-name="2.0.0" \
            --build-number="$BUILD_NUM" \
            --dart-define="AM_DOMAIN=${AM_DOMAIN}" \
            --dart-define="AM_ENV=${AM_ENV}"

    artifacts:
      - am_app/build/app/outputs/bundle/**/*.aab
      - am_app/build/app/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - admin@asrax.in
        notify:
          failure: true
          success: true

  ios-workflow:
    name: iOS Release Build & Distribution
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.asrax.aminvestment"
        AM_DOMAIN: "am.asrax.in"
        AM_ENV: "prod"
      groups:
        - ios_credentials # Codemagic environment variable group for iOS certs & App Store Connect
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'feature/**'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true

    scripts:
      - name: Disable Flutter Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Resolve pub dependencies across monorepo
        script: |
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {})
          for dir in $dirs; do
            echo "Running pub get in $dir..."
            (cd "$dir" && flutter pub get)
          done

      - name: Clean duplicate Pods files
        script: |
          find am_app/ios -name "* 2.*" -delete 2>/dev/null || true

      - name: Run build_runner code generation
        script: |
          cd am_app
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          fi

      - name: Install CocoaPods
        script: |
          cd am_app/ios
          pod install

      - name: Setup iOS Signing & Build IPA
        script: |
          cd am_app
          BUILD_NUM=${BUILD_NUMBER:-1}
          if [ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ] && [ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "Setting up App Store Connect code signing..."
            keychain initialize
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project use-profiles
            flutter build ipa --release \
              --build-name="2.0.0" \
              --build-number="$BUILD_NUM" \
              --dart-define="AM_DOMAIN=${AM_DOMAIN}" \
              --dart-define="AM_ENV=${AM_ENV}"
          else
            echo "App Store Connect secrets empty — building unsigned iOS app"
            flutter build ios --no-codesign --release \
              --build-name="2.0.0" \
              --build-number="$BUILD_NUM" \
              --dart-define="AM_DOMAIN=${AM_DOMAIN}" \
              --dart-define="AM_ENV=${AM_ENV}"
          fi

    artifacts:
      - am_app/build/ios/ipa/*.ipa
      - am_app/build/ios/iphoneos/*.app

    publishing:
      email:
        recipients:
          - admin@asrax.in
        notify:
          failure: true
          success: true
