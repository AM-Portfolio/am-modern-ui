# Codemagic — AM Flutter Modern UI (monorepo)
# Keep ONE Codemagic application (rename in UI to "AM Flutter · Modern UI").
# CI workflows: auto on feature/develop/PR (artifacts + email only).
# Store workflows: manual Start build (Play Internal / TestFlight).

workflows:
  # ---------------------------------------------------------------------------
  # Android CI — AAB only (no Play upload)
  # ---------------------------------------------------------------------------
  android-ci-build:
    name: Android CI · AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.asrax.aminvestment"
        AM_DOMAIN: "am.asrax.in"
        AM_ENV: "prod"
      groups:
        - android_credentials
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'feature/**'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
    scripts:
      - name: Disable Flutter Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Clean build directory
        script: |
          rm -rf am_app/build build 2>/dev/null || true
      - name: Resolve pub dependencies across monorepo
        script: |
          set -euo pipefail
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            echo "Running pub get in $dir..."
            (cd "$dir" && flutter pub get)
          done
      - name: Run build_runner code generation across all packages
        script: |
          set -euo pipefail
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            if grep -q "build_runner" "$dir/pubspec.yaml"; then
              echo "Running build_runner in $dir..."
              (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
            fi
          done
          test -f am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
          grep -q "coversEtfSymbol" am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
          echo "Freezed BasketLineDetail getters OK"
      - name: Setup Android Keystore & key.properties
        script: |
          KEYSTORE_B64="${ANDROID_KEYSTORE_BASE64:-}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Decoding Keystore..."
            echo "$KEYSTORE_B64" | base64 -d > am_app/android/app/am_investment_keystore.jks 2>/dev/null \
              || echo "$KEYSTORE_B64" | base64 --decode > am_app/android/app/am_investment_keystore.jks
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD:-}" > am_app/android/key.properties
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-}" >> am_app/android/key.properties
            echo "keyAlias=${ANDROID_KEY_ALIAS:-}" >> am_app/android/key.properties
            echo "storeFile=am_investment_keystore.jks" >> am_app/android/key.properties
          else
            echo "Keystore secret empty — building release bundle with default/debug signing"
          fi
      - name: Build Android App Bundle (AAB)
        script: |
          set -euo pipefail
          cd am_app
          rm -rf build 2>/dev/null || true
          BUILD_NUM=${BUILD_NUMBER:-1}
          flutter build appbundle --release \
            --build-name="2.0.0" \
            --build-number="$BUILD_NUM" \
            --dart-define="AM_DOMAIN=${AM_DOMAIN}" \
            --dart-define="AM_ENV=${AM_ENV}"
    artifacts:
      - am_app/build/app/outputs/bundle/**/*.aab
      - am_app/build/app/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - admin@asrax.in
        notify:
          failure: true
          success: true

  # ---------------------------------------------------------------------------
  # Android · Play Internal — manual Start build (feature or main)
  # ---------------------------------------------------------------------------
  android-play-internal:
    name: Android · Play Internal
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.asrax.aminvestment"
        AM_DOMAIN: "am.asrax.in"
        AM_ENV: "prod"
      groups:
        - android_credentials
    # No auto triggering — Start new build only (avoids store spam on every push)
    scripts:
      - name: Disable Flutter Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Clean build directory
        script: |
          rm -rf am_app/build build 2>/dev/null || true
      - name: Resolve pub dependencies across monorepo
        script: |
          set -euo pipefail
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            (cd "$dir" && flutter pub get)
          done
      - name: Run build_runner code generation across all packages
        script: |
          set -euo pipefail
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            if grep -q "build_runner" "$dir/pubspec.yaml"; then
              (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
            fi
          done
          test -f am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
          grep -q "coversEtfSymbol" am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
      - name: Setup Android Keystore & key.properties
        script: |
          set -euo pipefail
          KEYSTORE_B64="${ANDROID_KEYSTORE_BASE64:-}"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 required for Play Internal"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > am_app/android/app/am_investment_keystore.jks 2>/dev/null \
            || echo "$KEYSTORE_B64" | base64 --decode > am_app/android/app/am_investment_keystore.jks
          echo "storePassword=${ANDROID_KEYSTORE_PASSWORD:-}" > am_app/android/key.properties
          echo "keyPassword=${ANDROID_KEY_PASSWORD:-}" >> am_app/android/key.properties
          echo "keyAlias=${ANDROID_KEY_ALIAS:-}" >> am_app/android/key.properties
          echo "storeFile=am_investment_keystore.jks" >> am_app/android/key.properties
      - name: Build Android App Bundle (AAB)
        script: |
          set -euo pipefail
          cd am_app
          rm -rf build 2>/dev/null || true
          BUILD_NUM=${BUILD_NUMBER:-1}
          flutter build appbundle --release \
            --build-name="2.0.0" \
            --build-number="$BUILD_NUM" \
            --dart-define="AM_DOMAIN=${AM_DOMAIN}" \
            --dart-define="AM_ENV=${AM_ENV}"
    artifacts:
      - am_app/build/app/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - admin@asrax.in
        notify:
          failure: true
          success: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  # ---------------------------------------------------------------------------
  # iOS CI — unsigned (no ASC publish)
  # ---------------------------------------------------------------------------
  ios-ci-build:
    name: iOS CI · unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.asrax.aminvestment"
        AM_DOMAIN: "am.asrax.in"
        AM_ENV: "prod"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'feature/**'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
    scripts:
      - name: Disable Flutter Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Clean build directory and duplicate files
        script: |
          rm -rf am_app/build build 2>/dev/null || true
          find am_app/ios -name "* 2.*" -delete 2>/dev/null || true
      - name: Resolve pub dependencies across monorepo
        script: |
          set -euo pipefail
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            (cd "$dir" && flutter pub get)
          done
      - name: Run build_runner code generation across all packages
        script: |
          set -euo pipefail
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            if grep -q "build_runner" "$dir/pubspec.yaml"; then
              (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
            fi
          done
          test -f am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
          grep -q "coversEtfSymbol" am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
      - name: Install CocoaPods
        script: |
          (cd am_app && flutter pub get)
          cd am_app/ios
          pod install
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          cd am_app
          rm -rf build 2>/dev/null || true
          BUILD_NUM=${BUILD_NUMBER:-1}
          flutter build ios --no-codesign --release \
            --build-name="2.0.0" \
            --build-number="$BUILD_NUM" \
            --dart-define="AM_DOMAIN=${AM_DOMAIN}" \
            --dart-define="AM_ENV=${AM_ENV}"
    artifacts:
      - am_app/build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - admin@asrax.in
        notify:
          failure: true
          success: true

  # ---------------------------------------------------------------------------
  # iOS · TestFlight — manual Start build
  # Requires Team → Developer Portal integration named exactly "Asrax ASC"
  # plus App Store distribution cert/profile (or auto-create via ASC API).
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Asrax ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Do not set ios_signing.distribution_type here unless matching App Store
      # profiles are uploaded in Codemagic Code signing identities — otherwise
      # the build fails before scripts. fetch-signing-files --create uses ASC.
      vars:
        BUNDLE_ID: "com.asrax.aminvestment"
        AM_DOMAIN: "am.asrax.in"
        AM_ENV: "prod"
      # Fallback API key vars (optional if Team integration is complete)
      groups:
        - ios_credentials
    # No auto triggering — Start new build only
    scripts:
      - name: Disable Flutter Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Clean build directory and duplicate files
        script: |
          rm -rf am_app/build build 2>/dev/null || true
          find am_app/ios -name "* 2.*" -delete 2>/dev/null || true
      - name: Resolve pub dependencies across monorepo
        script: |
          set -euo pipefail
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            (cd "$dir" && flutter pub get)
          done
      - name: Run build_runner code generation across all packages
        script: |
          set -euo pipefail
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            if grep -q "build_runner" "$dir/pubspec.yaml"; then
              (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
            fi
          done
          test -f am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
          grep -q "coversEtfSymbol" am_portfolio_ui/lib/features/basket/domain/models/basket_detail.freezed.dart
      - name: Install CocoaPods
        script: |
          (cd am_app && flutter pub get)
          cd am_app/ios
          pod install
      - name: Sign and build IPA
        script: |
          set -euo pipefail
          cd am_app
          rm -rf build 2>/dev/null || true
          BUILD_NUM=${BUILD_NUMBER:-1}
          keychain initialize
          # Uses Team ASC integration + ios_signing / uploaded certs
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          flutter build ipa --release \
            --build-name="2.0.0" \
            --build-number="$BUILD_NUM" \
            --dart-define="AM_DOMAIN=${AM_DOMAIN}" \
            --dart-define="AM_ENV=${AM_ENV}"
    artifacts:
      - am_app/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - admin@asrax.in
        notify:
          failure: true
          success: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
